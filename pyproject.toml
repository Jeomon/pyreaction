[project]
name = "pyreaction"
version = "0.1.0"
description = "React-style UI components in pure Python, rendered on the server and patched into the browser over a WebSocket."
readme = "README.md"
authors = [
    { name = "jeomon", email = "jeogeoalukka@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["react", "ui", "components", "hooks", "asgi", "websocket"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    # PyPI rejects any upload with this classifier: the project is private.
    "Private :: Do Not Upload",
]
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.30",
    "websockets>=12",
]

[project.scripts]
pyreaction = "pyreaction.cli:main"

[project.optional-dependencies]
fast = ["orjson>=3.9"]
# For tests in a real browser with pyreaction.testing.serve().
browser = ["playwright>=1.50"]
# Stores shared by several worker processes: Store(..., backend=RedisBackend(url)).
redis = ["redis>=5"]

[dependency-groups]
dev = [
    "fakeredis>=2.20",
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "playwright>=1.50",
    "pytest>=8",
    "redis>=5",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: runs in a real browser through Playwright (skipped when none is available)"]

[tool.mypy]
python_version = "3.11"
files = ["src/pyreaction"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# The project template imports modules that only exist in a generated project.
exclude = ["cli/templates/"]

[[tool.mypy.overrides]]
module = ["orjson", "redis", "fakeredis"]
ignore_missing_imports = true
